<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a44"/>
      <stop offset="1" stop-color="#15151a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <clipPath id="photo-clip">
      <rect x="176" y="172" width="672" height="464" rx="20"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer rounded square -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Photo card (white frame) -->
  <g filter="url(#shadow)">
    <rect x="148" y="144" width="728" height="520" rx="32" fill="#fafafa"/>
  </g>

  <!-- Photo content -->
  <g clip-path="url(#photo-clip)">
    <!-- Sunset sky -->
    <rect x="176" y="172" width="672" height="464" fill="url(#sky)"/>
    <!-- Sun -->
    <circle cx="660" cy="304" r="58" fill="#fff7ed"/>
    <circle cx="660" cy="304" r="58" fill="#fde68a" opacity="0.4"/>
    <!-- Back mountain -->
    <path d="M 176 470 L 320 322 L 460 412 L 600 310 L 720 388 L 848 350 L 848 636 L 176 636 Z"
          fill="#7c2d12" opacity="0.65"/>
    <!-- Front mountain -->
    <path d="M 176 538 L 260 466 L 380 522 L 500 432 L 620 510 L 740 458 L 848 526 L 848 636 L 176 636 Z"
          fill="#1c1c1f"/>
    <!-- Reflection band -->
    <rect x="176" y="600" width="672" height="36" fill="#000" opacity="0.18"/>
  </g>

  <!-- KH wordmark -->
  <text
    x="512" y="900"
    text-anchor="middle"
    fill="#ffffff"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="900"
    font-size="220"
    letter-spacing="-12">KH</text>
</svg>
